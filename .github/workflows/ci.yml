name: Verify Suzanne
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: suzanne
          POSTGRES_PASSWORD: local-demo-only
          POSTGRES_DB: suzanne_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U suzanne -d suzanne_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - name: SQLite access and migrations
        run: PYTHONPATH=apps/api pytest apps/api/tests -q
      - name: PostgreSQL access and migrations
        run: PYTHONPATH=apps/api pytest apps/api/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://suzanne:local-demo-only@localhost:5432/suzanne_test
      - run: pip-audit -r apps/api/requirements.txt --no-deps --disable-pip
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build
      - run: npm audit --audit-level=high
      - run: pip install -r apps/api/requirements.txt
      - run: alembic -c apps/api/alembic.ini upgrade head && PYTHONPATH=apps/api python -m suzanne.seed
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys
        run: |
          PYTHONPATH=apps/api uvicorn suzanne.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/api.log 2>&1 &
          npm start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break || sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 180
      - name: PostgreSQL-backed smoke test
        run: |
          curl --fail http://localhost:3000/api/health
          curl --fail -c /tmp/cookies -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' -d '{"email":"camille@example.test","password":"Suzanne-demo-2026!"}' http://localhost:3000/api/auth/login
          curl --fail -b /tmp/cookies http://localhost:3000/api/households/atelier/children
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/cookies http://localhost:3000/api/households/horizon/dashboard)" = '404'
      - if: always()
        run: docker compose logs && docker compose down -v
